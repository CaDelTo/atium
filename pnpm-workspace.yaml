packages:
  - "packages/*"
  - "packages/*/*"
  - "examples/*"

# Dependency install scripts are blocked unless explicitly allowed here
# (docs/engineering/06-security.md).
allowBuilds:
  # Native addon for @atium/storage-sqlite. The package ships prebuilt binaries
  # for Linux, macOS and Windows (x64 and arm64); its node-gyp build only
  # compiles the addon on other platforms.
  better-sqlite3: true
  # The postinstall only verifies the binary that the optional @esbuild/*
  # package already provides.
  esbuild: false
  # The postinstall only runs `lefthook install` to register the Git hooks
  # (lefthook.yml); it does nothing when CI is set.
  lefthook: true
strictDepBuilds: true

# Resolve only versions published at least 14 days ago, transitive ones included
# (docs/engineering/06-security.md). In minutes.
minimumReleaseAge: 20160

# Transitive versions forced to fix security advisories that no eligible
# direct dependency fixes yet (docs/engineering/06-security.md). Each entry
# names its advisory and when to remove it.
overrides:
  # GHSA-g7r4-m6w7-qqqr (low): esbuild <0.28.1. tsup 8.5.1 declares
  # esbuild ^0.27.0. Remove when tsup declares esbuild ^0.28.1 or later.
  "tsup>esbuild": ^0.28.2
  # GHSA-67mh-4wv8-2f99 (moderate): esbuild <=0.24.2, pulled by drizzle-kit
  # through the deprecated @esbuild-kit packages. Pinned to the series that
  # drizzle-kit itself uses. Remove when drizzle-kit drops @esbuild-kit.
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
